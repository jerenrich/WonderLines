name: Worker CI and deployment

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/**'
      - '!workers/**/*.md'
      - 'Scripts/worker_deployments.mjs'
      - 'Scripts/test_worker_deployments.mjs'
      - 'Scripts/test_worker.mjs'
      - 'Scripts/test_model_registry.mjs'
      - 'Scripts/model_registry.mjs'
      - 'Scripts/test_z_image.mjs'
      - 'Scripts/test_comparison_queue.mjs'
      - 'Scripts/test_comparison_runner.mjs'
      - 'Scripts/test_provider_diagnostics.mjs'
      - 'Scripts/test_operational_events.mjs'
      - 'Scripts/test_monitoring.mjs'
      - 'Scripts/test_moderation_canary.mjs'
      - 'Scripts/test_request_security.mjs'
      - 'Scripts/test_privacy.mjs'
      - 'Scripts/test_reporting_concurrency.mjs'
      - 'Scripts/test_diagnostic_retention.mjs'
      - 'Scripts/test_image_retention.mjs'
      - 'Scripts/test_image_cost.mjs'
      - 'Scripts/test_app_attest.mjs'
      - 'Scripts/test_moderation.mjs'
      - 'Scripts/test_parallel_moderation.mjs'
      - 'Scripts/test_moderation_calibration.mjs'
      - 'Scripts/lib/moderation-calibration.mjs'
      - 'Scripts/test_batch_moderation.mjs'
      - 'Scripts/test_account_safety.mjs'
      - 'Scripts/test_account_retention.mjs'
      - 'Scripts/fixtures/**'
      - '.github/workflows/worker.yml'
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '!workers/**/*.md'
      - 'Scripts/worker_deployments.mjs'
      - 'Scripts/test_worker_deployments.mjs'
      - 'Scripts/test_worker.mjs'
      - 'Scripts/test_model_registry.mjs'
      - 'Scripts/model_registry.mjs'
      - 'Scripts/test_z_image.mjs'
      - 'Scripts/test_comparison_queue.mjs'
      - 'Scripts/test_comparison_runner.mjs'
      - 'Scripts/test_provider_diagnostics.mjs'
      - 'Scripts/test_operational_events.mjs'
      - 'Scripts/test_monitoring.mjs'
      - 'Scripts/test_moderation_canary.mjs'
      - 'Scripts/test_request_security.mjs'
      - 'Scripts/test_privacy.mjs'
      - 'Scripts/test_reporting_concurrency.mjs'
      - 'Scripts/test_diagnostic_retention.mjs'
      - 'Scripts/test_image_retention.mjs'
      - 'Scripts/test_image_cost.mjs'
      - 'Scripts/test_app_attest.mjs'
      - 'Scripts/test_moderation.mjs'
      - 'Scripts/test_parallel_moderation.mjs'
      - 'Scripts/test_moderation_calibration.mjs'
      - 'Scripts/lib/moderation-calibration.mjs'
      - 'Scripts/test_batch_moderation.mjs'
      - 'Scripts/test_account_safety.mjs'
      - 'Scripts/test_account_retention.mjs'
      - 'Scripts/fixtures/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: Worker to deploy from main (all preserves dependency order)
        type: choice
        default: all
        options:
          - all
          - api
          - comparison
          - moderation
          - monitoring
          - log_retention

permissions:
  contents: read
  actions: read

# Never interrupt a production upload. PR checks can replace older PR checks.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('worker-pr-{0}', github.event.pull_request.number) || 'worker-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    name: Test and deploy API and comparison labs
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Production runs resolve main after acquiring the concurrency lock.
          # An old rerun therefore cannot roll production back to an old commit.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Record tested commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install comparison studio authentication dependency
        run: npm ci --ignore-scripts --no-fund --no-audit --prefix workers/generation-lab

      - name: Run offline Worker and image cost tests
        run: |
          node Scripts/test_worker_deployments.mjs
          node Scripts/test_worker.mjs
          node Scripts/test_model_registry.mjs
          node Scripts/test_z_image.mjs
          node Scripts/test_image_cost.mjs
          node Scripts/test_comparison_queue.mjs
          node Scripts/test_comparison_runner.mjs
          node Scripts/test_provider_diagnostics.mjs
          node Scripts/test_operational_events.mjs
          node Scripts/test_monitoring.mjs
          node Scripts/test_moderation_canary.mjs
          node Scripts/test_request_security.mjs
          node Scripts/test_privacy.mjs
          node Scripts/test_reporting_concurrency.mjs
          node Scripts/test_batch_moderation.mjs
          node Scripts/test_account_safety.mjs
          node Scripts/test_account_retention.mjs
          node workers/generation-lab/tests/suspension-admin.mjs
          node Scripts/test_moderation.mjs
          node Scripts/test_parallel_moderation.mjs
          node Scripts/test_moderation_calibration.mjs
          node workers/moderation-lab/tests/worker.mjs
          node workers/generation-lab/tests/worker.mjs
          node workers/generation-lab/tests/admin-auth.mjs
          node workers/generation-lab/tests/model-admin.mjs
          node workers/generation-lab/tests/library.mjs
          node workers/generation-lab/tests/retry.mjs
          node workers/generation-lab/tests/cost-display.mjs
          node workers/generation-lab/tests/model-reference-cost.mjs
          node workers/generation-lab/tests/fal.mjs
          node workers/log-retention/tests/worker.mjs
          node Scripts/test_diagnostic_retention.mjs
          node Scripts/test_image_retention.mjs
          node --check workers/moderation-lab/public/app.js
          node --check workers/generation-lab/public/app.js
          node --check workers/generation-lab/public/admin/models.js
          node --check workers/generation-lab/public/admin/suspensions.js

      - name: Find last successful production push
        id: baseline
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Event.before misses changes when pending runs are replaced or a prior
          # deployment fails. Successful push runs cover every selected Worker.
          # Manual runs may select only one Worker, so cannot advance this base.
          if ! base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/worker.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty'); then
            echo "::warning::Cannot read deployment history; conservatively deploying all Workers."
            base=''
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Select affected Workers
        id: deployments
        env:
          DEPLOYMENT_BASE: ${{ steps.baseline.outputs.sha }}
          DEPLOYMENT_TARGET: ${{ inputs.worker || 'all' }}
          LOG_RETENTION_WORKER_READY: ${{ vars.LOG_RETENTION_WORKER_READY }}
        run: node Scripts/worker_deployments.mjs

      - name: Check deployment credentials
        if: github.event_name != 'pull_request' && steps.deployments.outputs.any == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy monitoring before its producers
        id: deploy_monitoring
        if: github.event_name != 'pull_request' && steps.deployments.outputs.monitoring == 'true'
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/monitoring
          wranglerVersion: '4.136.3'
          command: deploy --message "GitHub main ${{ steps.revision.outputs.sha }}"

      - name: Deploy Worker
        id: deploy_api
        if: github.event_name != 'pull_request' && steps.deployments.outputs.api == 'true'
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/coloring-sheets-api
          wranglerVersion: '4.136.3'
          command: deploy --keep-vars --var AI_GATEWAY_ID:coloring-sheets --var MODERATION_GATEWAY_ID:coloring-sheets --var MODERATION_MODEL:clef --message "GitHub main ${{ steps.revision.outputs.sha }}"

      - name: Deploy moderation lab with the same policy revision
        id: deploy_moderation
        if: github.event_name != 'pull_request' && steps.deployments.outputs.moderation == 'true'
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/moderation-lab
          wranglerVersion: '4.136.3'
          command: deploy --keep-vars --message "GitHub main ${{ steps.revision.outputs.sha }}"

      - name: Deploy WonderLines comparison studio
        id: deploy_comparison
        if: github.event_name != 'pull_request' && steps.deployments.outputs.comparison == 'true'
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/generation-lab
          wranglerVersion: '4.136.3'
          command: deploy --keep-vars --message "GitHub main ${{ steps.revision.outputs.sha }}"

      - name: Deploy isolated Gateway log retention
        id: deploy_log_retention
        # Bootstrap with the dedicated secret before enabling this repository variable.
        if: github.event_name != 'pull_request' && steps.deployments.outputs.log_retention == 'true'
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/log-retention
          wranglerVersion: '4.136.3'
          command: deploy --message "GitHub main ${{ steps.revision.outputs.sha }}"

      - name: Summarize deployment results
        if: always() && github.event_name != 'pull_request' && steps.deployments.outcome == 'success'
        env:
          DEPLOYED_SHA: ${{ steps.revision.outputs.sha }}
          MONITORING: ${{ steps.deploy_monitoring.outcome }}
          API: ${{ steps.deploy_api.outcome }}
          MODERATION: ${{ steps.deploy_moderation.outcome }}
          COMPARISON: ${{ steps.deploy_comparison.outcome }}
          LOG_RETENTION: ${{ steps.deploy_log_retention.outcome }}
        run: |
          {
            echo '### Worker deployment results'
            echo "Tested commit: [$DEPLOYED_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$DEPLOYED_SHA)"
            echo ''
            echo '| Worker | Result |'
            echo '| --- | --- |'
            echo "| Monitoring | $MONITORING |"
            echo "| API | $API |"
            echo "| Moderation lab | $MODERATION |"
            echo "| Comparison studio | $COMPARISON |"
            echo "| Log retention | $LOG_RETENTION |"
          } >> "$GITHUB_STEP_SUMMARY"
